apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lumo-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dkenterprises2/lumo-ai-trading.git
    targetRevision: HEAD
    path: infrastructure/helm/lumo-api
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
