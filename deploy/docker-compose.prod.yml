version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lumo-backend-prod
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://lumo_user:lumo_password@postgres:5432/lumo_prod
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: lumo-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: lumo-postgres
    restart: always
    environment:
      POSTGRES_USER: lumo_user
      POSTGRES_PASSWORD: lumo_password
      POSTGRES_DB: lumo_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lumo-redis
    restart: always
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: lumo-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: lumo-grafana
    ports:
      - "3001:3000"

volumes:
  postgres_data:
