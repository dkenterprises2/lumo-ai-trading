apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lumo-backend-hpa
  namespace: lumo-trading
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumo-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
