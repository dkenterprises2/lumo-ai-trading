apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumo-ingress
  namespace: lumo-trading
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.lumo.trade
    secretName: lumo-api-tls
  rules:
  - host: api.lumo.trade
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lumo-backend-service
            port:
              number: 8000
