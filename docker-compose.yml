version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lumo-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-LumoProdPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-lumo_trading_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumo_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumo-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lumo_admin}:${POSTGRES_PASSWORD:-LumoProdPass2026!}@postgres:5432/${POSTGRES_DB:-lumo_trading_prod}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-LUMO_PROD_SECRET_JWT_KEY_2026_V21}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumo-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://app.lumo.trade
      - NEXT_PUBLIC_WS_URL=wss://app.lumo.trade/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: lumo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
