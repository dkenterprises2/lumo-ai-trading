version: "3.9"

services:
  # Python FastAPI Institutional Backend
  lumo-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumo-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - SQLITE_JOURNAL_MODE=WAL
      - ENABLE_LEGACY_GENERIC_SPOT_BOT=false
      - VERCEL_FRONTEND_URL=https://app.lumotrading.com
    volumes:
      - lumo-db-data:/app/data
      - ./lumo_trading.db:/app/lumo_trading.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Next.js 16 Production Frontend
  lumo-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumo-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - lumo-backend

  # Caddy Automatic HTTPS Reverse Proxy (Optional / Recommended for AWS)
  caddy-proxy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - lumo-backend
      - lumo-frontend

volumes:
  lumo-db-data:
  caddy-data:
  caddy-config:
